name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API PHP (tests d'intégration)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: sf_test
          MARIADB_USER: sf
          MARIADB_PASSWORD: sf
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, intl
          coverage: none
      - name: Vérification de syntaxe PHP
        run: find src public bin tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Tests PHPUnit
        run: vendor/bin/phpunit

  front:
    name: Interface (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tests Vitest
        run: npx vitest run
      - name: Build
        run: npm run build
